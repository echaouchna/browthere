name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # SwiftUI macros ship with Xcode, not the Command Line Tools.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: swift --version

      - name: Run tests
        run: swift test

      - name: Build the app
        run: ./scripts/build-app.sh

      - name: Zip the app
        # ditto keeps the code signature intact (plain zip can break it).
        run: ditto -c -k --keepParent build/BrowThere.app build/BrowThere.zip

      - uses: actions/upload-artifact@v4
        with:
          name: BrowThere-${{ github.sha }}
          path: build/BrowThere.zip
          retention-days: 14
