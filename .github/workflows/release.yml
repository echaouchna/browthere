name: Release

# Push a tag that matches CFBundleShortVersionString in Resources/Info.plist:
#   git tag v0.1.0 && git push origin v0.1.0
#
# Optional secrets for a signed, notarized build that opens without warnings:
#   DEVELOPER_ID_P12           base64 of your "Developer ID Application" certificate (.p12)
#   DEVELOPER_ID_P12_PASSWORD  the .p12 password
#   APPLE_ID                   Apple ID email used for notarization
#   APPLE_TEAM_ID              10-character team ID
#   APPLE_APP_PASSWORD         app-specific password from appleid.apple.com
# Without them the release is ad-hoc signed and the notes explain how to open it.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    name: Build and publish
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      HAS_SIGNING: ${{ secrets.DEVELOPER_ID_P12 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Check the tag matches the app version
        run: |
          version=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" Resources/Info.plist)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version $version in Resources/Info.plist. Bump the version or tag v$version."
            exit 1
          fi

      - name: Run tests
        run: swift test

      - name: Set up signing and notarization
        if: env.HAS_SIGNING == 'true'
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(uuidgen)
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          read -ra existing <<< "$(security list-keychains -d user | tr -d '"')"
          security list-keychains -d user -s "$keychain" "${existing[@]}"
          rm "$RUNNER_TEMP/cert.p12"

          identity=$(security find-identity -v -p codesigning "$keychain" | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')
          if [ -z "$identity" ]; then
            echo "::error::No Developer ID Application identity found in DEVELOPER_ID_P12."
            exit 1
          fi
          xcrun notarytool store-credentials browthere --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --keychain "$keychain"
          echo "SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "NOTARY_PROFILE=browthere" >> "$GITHUB_ENV"

      - name: Build, package and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/release.sh --publish

      - name: Remove the signing keychain
        if: always() && env.HAS_SIGNING == 'true'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
